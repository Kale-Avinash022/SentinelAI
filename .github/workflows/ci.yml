name: CI Quality & Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint, Type Check, Test & Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.lock

      - name: Check code formatting (Ruff)
        run: |
          ruff format --check .

      - name: Lint code (Ruff)
        run: |
          ruff check .

      - name: Type check (Mypy)
        run: |
          mypy backend

      - name: Run unit test suite (Pytest)
        run: |
          pytest backend/tests/unit -q

      - name: Static Application Security Testing (Bandit)
        run: |
          bandit -r backend/app -q

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip-audit -r backend/requirements.lock --desc

      - name: Credential leak scan (detect-secrets)
        run: |
          detect-secrets scan --baseline .secrets.baseline

      - name: SAST Code Analysis (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
        continue-on-error: false

  # ---------------------------------------------------------------------------
  # Day 011 — cross-tenant isolation is a CI invariant, not a manual check.
  # Runs the adversarial security suite and the RLS/schema integration suites
  # against a *real* PostgreSQL 16 as the non-owner API role (sentinel_app,
  # NOBYPASSRLS) — never a mock and never a superuser. Acceptance check 4:
  # "CI uses the real non-owner PostgreSQL role."
  # ---------------------------------------------------------------------------
  tenant-isolation:
    name: Cross-Tenant Isolation (real PostgreSQL, sentinel_app)
    runs-on: ubuntu-latest

    # PostgreSQL credentials come from repository secrets — never hard-coded.
    # These protect only an ephemeral, empty, runner-local database that exists
    # for the duration of the job and is destroyed afterwards, but keeping them
    # as secrets avoids committing password-looking literals. Create these three
    # secrets under Settings → Secrets and variables → Actions, using URL-safe
    # (alphanumeric) values so they embed cleanly in the asyncpg DSNs below:
    #   CI_POSTGRES_SUPERUSER_PASSWORD  POSTGRES_PASSWORD for the service image
    #   CI_POSTGRES_MIGRATOR_PASSWORD   sentinel_migrator role (matches DSN)
    #   CI_POSTGRES_APP_PASSWORD        sentinel_app role (matches DSN)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_SUPERUSER_PASSWORD }}
          # Roles created by infra/docker/postgres/init-roles.sh at first boot;
          # the passwords below must match the DSNs in the job env block.
          POSTGRES_MIGRATOR_USER: sentinel_migrator
          POSTGRES_MIGRATOR_PASSWORD: ${{ secrets.CI_POSTGRES_MIGRATOR_PASSWORD }}
          POSTGRES_APP_USER: sentinel_app
          POSTGRES_APP_PASSWORD: ${{ secrets.CI_POSTGRES_APP_PASSWORD }}
        ports:
          - 5432:5432
        # First-boot entrypoint creates the least-privilege migrator
        # (BYPASSRLS admin) and app (NOBYPASSRLS) roles exactly as in dev.
        volumes:
          - ./infra/docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/99-init-roles.sh:ro
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 12

    env:
      ENVIRONMENT: test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://sentinel_migrator:${{ secrets.CI_POSTGRES_MIGRATOR_PASSWORD }}@127.0.0.1:5432/sentinel_ai
      DATABASE_URL: postgresql+asyncpg://sentinel_app:${{ secrets.CI_POSTGRES_APP_PASSWORD }}@127.0.0.1:5432/sentinel_ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.lock

      - name: Apply migrations to head (schema owner)
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Prove tenant isolation (security + RLS/schema integration)
        run: python -m pytest backend/tests/security backend/tests/integration -q


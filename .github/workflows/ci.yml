name: CI Quality & Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint, Type Check, Test & Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.lock

      - name: Check code formatting (Ruff)
        run: |
          ruff format --check .

      - name: Lint code (Ruff)
        run: |
          ruff check .

      - name: Type check (Mypy)
        run: |
          mypy backend

      - name: Run unit test suite (Pytest)
        run: |
          pytest backend/tests/unit -q

      - name: Static Application Security Testing (Bandit)
        run: |
          bandit -r backend/app -q

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip-audit -r backend/requirements.lock --desc

      - name: Credential leak scan (detect-secrets)
        run: |
          detect-secrets scan --baseline .secrets.baseline

      - name: SAST Code Analysis (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
        continue-on-error: false


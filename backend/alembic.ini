# SentinelAI Alembic configuration (Day 005).
# Run from the repository root:
#   PYTHONPATH=backend .venv/Scripts/python -m alembic -c backend/alembic.ini upgrade head
#   PYTHONPATH=backend .venv/Scripts/python -m alembic -c backend/alembic.ini current
#
# sqlalchemy.url is intentionally NOT set here: migrations/env.py resolves it from
# MIGRATION_DATABASE_URL (schema owner only) or a programmatically supplied URL,
# so DSNs never live in this committed file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
version_path_separator = os
version_path = %(here)s/migrations/versions

[post_write_hooks]
# Intentionally empty: generated revisions are normalized by `scripts/check.ps1`
# (Ruff format/lint), which also runs in CI.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
